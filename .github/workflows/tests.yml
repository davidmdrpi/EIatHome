name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  signal-lm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tracks/llm/requirements.txt
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r tracks/llm/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_signal_lm.py' -v
      - run: python -m unittest discover -s tests -p 'test_recovery_learned.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_anchor.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_merge.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_moe.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_moe_v2.py' -v

  extract-slices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.24' 'h5py>=3.8' 'hdf5plugin>=4.1'
      - run: python -m unittest discover -s tests -p 'test_extract_slices.py' -v

  signal-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Node runs the Live Lab's recovery unit, which the Python port is checked against.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install 'numpy>=1.24,<3'
      - run: python -m unittest discover -s tests -p 'test_recovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_recovery_browser.py' -v
      - run: python -m unittest discover -s tests -p 'test_recovery_sessions.py' -v
