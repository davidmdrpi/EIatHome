name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  signal-lm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tracks/llm/requirements.txt
            tracks/llm/constraints.txt
      - run: python -m pip install -c tracks/llm/constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c tracks/llm/constraints.txt -r tracks/llm/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_signal_lm.py' -v
      - run: python -m unittest discover -s tests -p 'test_recovery_learned.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_anchor.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_merge.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_moe.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_moe_v2.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_route.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_selective.py' -v
      - run: python -m unittest discover -s tests -p 'test_llm_sessions.py' -v
      # The session benchmark's published checkpoints: hashes, provenance, and their one-shot merges replayed.
      - run: python -m tracks.llm.session_bench verify
      # The same for the fresh cohort, sessions-v1 (its split pinned before anything trained on it).
      - run: python -m tracks.llm.session_bench verify --benchmark v1
      - run: python -m unittest discover -s tests -p 'test_llm_wsp.py' -v
      # The WSP benchmark's published picks: every edit program and query replayed from the cohort, and rescored.
      - run: python -m tracks.llm.wsp_bench verify
      - run: python -m unittest discover -s tests -p 'test_wsp_publication.py' -v
      # Pending until the complete frozen experiment is published; partial publications fail.
      - run: python -m tools.wsp_publication check --allow-absent
      - run: python -m unittest discover -s tests -p 'test_llm_pilot.py' -v
      # The checkpoint pilot's ledger: every stored contribution and merge replayed.
      - run: python -m tracks.llm.pilot verify
      # The Live Lab's copy of its status (web/data/pilot_status.json) is the ledger's.
      - run: python -m tracks.llm.pilot export --check

  extract-slices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.24' 'h5py>=3.8' 'hdf5plugin>=4.1'
      - run: python -m unittest discover -s tests -p 'test_extract_slices.py' -v

  signal-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Node runs the Live Lab's recovery unit, which the Python port is checked against.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: python -m pip install 'numpy>=1.24,<3'
      - run: python -m unittest discover -s tests -p 'test_recovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_recovery_browser.py' -v
      - run: python -m unittest discover -s tests -p 'test_recovery_sessions.py' -v
