name: Ingest checkpoint contributions

# Volunteers contribute to the checkpoint pilot (tracks/llm/PILOT.md) with issues titled
# "Checkpoint contribution: ...". tools/ingest_issues.mjs --kind checkpoint runs
# `python -m tracks.llm.pilot ingest` on each. That checks the artifact's identities, evaluates
# it independently, retrains its shard to see whether it replicates, and stores what it accepts
# under tracks/llm/pilot on main; the issue gets a receipt and a label. The issue text is
# untrusted: it's only parsed as JSON and checked, never interpolated into a shell command.
#
# Runs share ingest-results.yml's concurrency group, since both commit to main. A run that's
# cancelled or fails leaves its issue unlabelled or labelled checkpoint-pending, and the
# scheduled run picks it up.

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 3-23/6 * * *" # retry anything a cancelled or failed run missed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest-results
  cancel-in-progress: false
  queue: max

jobs:
  ingest:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Checkpoint contribution:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tracks/llm/requirements.txt
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r tracks/llm/requirements.txt
      - name: Record checkpoint issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$ISSUE" ]; then
            node tools/ingest_issues.mjs --kind checkpoint "$ISSUE"
          else
            node tools/ingest_issues.mjs --kind checkpoint --pending
          fi
