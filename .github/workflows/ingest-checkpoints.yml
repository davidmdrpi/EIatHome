name: Ingest checkpoint contributions

# Volunteers contribute to the checkpoint pilot (tracks/llm/PILOT.md) with issues titled
# "Checkpoint contribution: ...". tools/ingest_issues.mjs --kind checkpoint runs
# `python -m tracks.llm.pilot ingest` on each. That checks the artifact's identities, evaluates
# it independently, retrains its shard to see whether it replicates, and stores what it accepts
# under tracks/llm/pilot on main, with the pilot's status rewritten to web/data/pilot_status.json
# for the Live Lab's Contributions tab, which is redeployed; the issue gets a receipt and a
# label. The issue text is untrusted: it's only parsed as JSON and checked, never interpolated
# into a shell command.
#
# Runs share ingest-results.yml's concurrency group, since both commit to main. A run that's
# cancelled or fails leaves its issue unlabelled or labelled checkpoint-pending, and the
# scheduled run picks it up.

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 3-23/6 * * *" # retry anything a cancelled or failed run missed
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write # to request the Pages deploy (pushes with the workflow token don't trigger it)

concurrency:
  group: ingest-results
  cancel-in-progress: false
  queue: max

jobs:
  ingest:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Checkpoint contribution:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tracks/llm/requirements.txt
            tracks/llm/constraints.txt
      - run: python -m pip install -c tracks/llm/constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c tracks/llm/constraints.txt -r tracks/llm/requirements.txt
      - name: Record checkpoint issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$ISSUE" ]; then
            node tools/ingest_issues.mjs --kind checkpoint "$ISSUE"
          else
            node tools/ingest_issues.mjs --kind checkpoint --pending
          fi
